# Machine-readable settings. The agent file (CLAUDE.md / AGENTS.md) carries
# policy only. Scripts read THIS file.
version: 1

project:
  key: OKF
  name: "OKF Graph Engineering Plugin"

ticketing:
  system: github               # github | gitlab | jira | ado | linear | codecatalyst | other | none
  project: SpillwaveSolutions/okf-plugin

wiki:
  system: github-wiki          # github-wiki | gitlab-wiki | ado-wiki | confluence | other | none
  root_url: https://github.com/SpillwaveSolutions/okf-plugin/wiki

release:
  sync_docs:            # docs regenerated by background agents at every release
    - design-doc        # docs/designs/current_design_doc.md + dated freeze
    - code-walkthrough  # docs/designs/current_code_walkthrough.md + dated freeze
    - user-guide        # docs/user_guide/*.md refreshed against diff since last tag
    - readme            # README.md same

paths:
  plans: docs/plans
  status: docs/status
  roadmap: docs/roadmap.md

status:
  default_kind: daily
  week_starts: monday
  publish: true

sync:
  active_window_days: 14
  conflict_policy: report
  push_on_capture: true

features:
  auto_merge_on_green: true

classifier:
  enabled: false
  min_confidence: 0.7
  debounce: stop

installed: 0.18.0
